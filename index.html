<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pihu's Books &amp; Classes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
/* ==========================================================
   Nothing in this <style> block ever needs changing.
   All content is edited in the EDIT BLOCK further down.
   ========================================================== */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#f4f6fb;color:#1c2233;
  padding:20px 16px 60px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:980px;margin:0 auto}
header{text-align:center;margin-bottom:26px}
header h1{font-size:1.9rem;font-weight:800;letter-spacing:-.5px}
header p{color:#6b7590;font-size:.95rem;margin-top:4px}
h2.section{
  font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;
  color:#8a93ab;margin:30px 0 12px;
}
/* ---- class join buttons ---- */
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.class-btn{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-radius:16px;text-decoration:none;color:#fff;
  font-weight:700;font-size:1.02rem;
  box-shadow:0 4px 14px rgba(20,30,60,.14);
  transition:transform .12s ease;
}
.class-btn:active{transform:scale(.97)}
.class-btn .ic{font-size:1.5rem;line-height:1}
.class-btn .sub{display:block;font-weight:500;font-size:.78rem;opacity:.92}
.class-btn.todo{background:#c9cee0 !important;color:#5d6480;box-shadow:none;cursor:default}
/* ---- breadcrumb / back ---- */
.bar{display:flex;align-items:center;gap:10px;margin:30px 0 12px;min-height:34px}
.back{
  background:#fff;border:1px solid #dfe4f0;border-radius:10px;
  padding:7px 13px;font-size:.85rem;font-weight:600;color:#3b4667;cursor:pointer;
}
.back:hover{background:#eef1f8}
.crumb{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#8a93ab}
/* ---- cards ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{
  background:#fff;border-radius:18px;padding:20px 14px;text-align:center;
  border:2px solid #fff;cursor:pointer;text-decoration:none;color:inherit;display:block;
  box-shadow:0 2px 10px rgba(20,30,60,.07);
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,30,60,.13)}
.card:active{transform:scale(.97)}
.card .ic{font-size:2.4rem;display:block;margin-bottom:8px}
.card .nm{display:block;font-weight:700;font-size:1.02rem;word-break:break-word}
.card .meta{display:block;font-size:.77rem;color:#8a93ab;margin-top:4px}
.card.todo{opacity:.55;cursor:default}
.card.todo:hover{transform:none;box-shadow:0 2px 10px rgba(20,30,60,.07)}
.card .num{
  display:inline-block;min-width:34px;height:34px;line-height:34px;border-radius:50%;
  background:#eef1f8;font-weight:800;font-size:1rem;color:#3b4667;margin-bottom:8px;
}
footer{text-align:center;color:#9aa2b8;font-size:.8rem;margin-top:44px}
</style>
</head>

  <div class="grid" id="grid"></div>

      greyed out as "link coming soon" instead of breaking.

/* ==================================================================
   ===============   E D I T   O N L Y   A B O V E   =================
   ================== nothing below needs changing ==================
   ================================================================== */

const $ = id => document.getElementById(id);
const has = u => !!(u && u.trim());
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const countChapters = b => (b.chapters || []).filter(c => /^\d/.test(c.label || "")).length;

$("title").textContent = "📚 " + CONFIG.studentName + "'s Books & Classes";
$("subtitle").textContent = CONFIG.tagline;
document.title = CONFIG.studentName + "'s Books & Classes";

/* --- drill-down: subjects → books → chapters --- */
let view = { level: "subjects", si: -1, bi: -1 };

function tile({ icon, num, name, meta, url, color, onClick, todo }) {
  const el = document.createElement(url ? "a" : "div");
  el.className = "card" + (todo ? " todo" : "");
  if (url) { el.href = url; el.target = "_blank"; el.rel = "noopener"; }
  if (color) el.style.borderColor = color;
  el.innerHTML =
    (num ? `<span class="num">${esc(num)}</span>` : `<span class="ic">${icon || "📄"}</span>`) +
    `<span class="nm">${esc(name)}</span>` +
    (meta ? `<span class="meta">${esc(meta)}</span>` : "");
  if (onClick) el.onclick = onClick;
  return el;
}

function render() {
  const grid = $("grid"), bar = $("bar");
  grid.innerHTML = ""; bar.innerHTML = "";

  if (view.level === "classes") {
    bar.innerHTML = `<button class="back">← Back</button><span class="crumb">🎥 Online classes</span>`;
    bar.querySelector(".back").onclick = () => { view = { level: "subjects" }; render(); };
    CONFIG.classes.forEach(c => {
      grid.appendChild(tile({
        icon: c.icon, name: c.name, color: c.color,
        meta: has(c.url) ? "tap to join" : "link coming soon",
        url: has(c.url) ? c.url : null,
        todo: !has(c.url)
      }));
    });
    return;
  }

  if (view.level === "subjects") {
    bar.innerHTML = `<span class="crumb">Classes & books</span>`;

    // quick links sit right at the front
    (CONFIG.quickLinks || []).forEach(q => grid.appendChild(tile({
      icon: q.icon, name: q.name, color: q.color,
      meta: has(q.url) ? (q.note || "open") : "link coming soon",
      url: has(q.url) ? q.url : null,
      todo: !has(q.url)
    })));

    // then the Classes card
    const liveCount = CONFIG.classes.filter(c => has(c.url)).length;
    grid.appendChild(tile({
      icon: "🎥", name: "Classes", color: "#5b5bd6",
      meta: liveCount + " class links",
      onClick: () => { view = { level: "classes" }; render(); }
    }));

    CONFIG.subjects.forEach((s, i) => {
      const only    = s.books.length === 1 ? s.books[0] : null;
      const direct  = only && !only.chapters;                 // one book, plain link
      const jump    = only && only.chapters;                  // one book, has chapters
      grid.appendChild(tile({
        icon: s.icon, name: s.name, color: s.color,
        meta: jump   ? countChapters(only) + " chapters"
            : direct ? only.title
            :          s.books.length + " books",
        url:  direct && has(only.url) ? only.url : null,
        todo: direct && !has(only.url),
        onClick: direct ? null : () => {
          view = jump ? { level: "chapters", si: i, bi: 0 } : { level: "books", si: i, bi: -1 };
          render();
        }
      }));
    });
    return;
  }

  const s = CONFIG.subjects[view.si];

  if (view.level === "books") {
    bar.innerHTML = `<button class="back">← Back</button><span class="crumb">${esc(s.icon + " " + s.name)}</span>`;
    bar.querySelector(".back").onclick = () => { view = { level: "subjects" }; render(); };
    s.books.forEach((b, j) => {
      const ch = b.chapters && b.chapters.length;
      grid.appendChild(tile({
        icon: "📕", name: b.title, color: s.color,
        meta: ch ? countChapters(b) + " chapters" : (has(b.url) ? "open book" : "link coming soon"),
        url: !ch && has(b.url) ? b.url : null,
        todo: !ch && !has(b.url),
        onClick: ch ? () => { view = { level: "chapters", si: view.si, bi: j }; render(); } : null
      }));
    });
    return;
  }

  const b = s.books[view.bi];
  const upLevel = s.books.length > 1 ? "books" : "subjects";
  bar.innerHTML = `<button class="back">← Back</button><span class="crumb">${esc(s.name + " · " + b.title)}</span>`;
  bar.querySelector(".back").onclick = () => { view = { level: upLevel, si: view.si }; render(); };
  b.chapters.forEach((c, k) => {
    grid.appendChild(tile({
      num: c.label || String(k + 1),
      name: c.title, color: s.color,
      url: has(c.url) ? c.url : null,
      todo: !has(c.url),
      meta: has(c.url) ? (c.by || "PDF") : "link coming soon"
    }));
  });
}

render();
</script>
